<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>The Bedtime Story Machine</title>
  <meta name="description" content="Pick a few sparks, get a bedtime story to tell." />

  <!-- PWA -->
  <meta name="theme-color" content="#160f2b" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Bedtime" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="stars" aria-hidden="true"></div>

  <main class="wrap">
    <header class="hero">
      <div class="moon" aria-hidden="true">☾</div>
      <h1>The Bedtime Story Machine</h1>
      <p class="tagline">pick a few sparks, get a story to tell ✨</p>
    </header>

    <section class="card" id="builder" aria-label="Story builder"></section>
    <section id="story" aria-live="polite"></section>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
